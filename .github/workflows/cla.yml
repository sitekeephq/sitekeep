# Contributor License Agreement check (CLA.md). The contributor accepts once by commenting the sentence
# below on a pull request; signatures are kept in the cla-signatures branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.repository == 'sitekeephq/sitekeep' && (
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [SiteKeep Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and accept it by commenting on this pull request with the sentence below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you.
