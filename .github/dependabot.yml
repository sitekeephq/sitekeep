# This repository is generated from SiteKeep's development repository; dependency updates land there and come
# over with the next sync. Dependabot here only reports security alerts (version-update pull requests are off).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
