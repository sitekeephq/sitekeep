# Build the SiteKeep Community image from this repository instead of pulling it (docs/onprem/docker-compose.md):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    image: sitekeep-local:community
    build:
      context: .
      args:
        EDITION: community
        # 0 skips the LibreDWG build (no DWG previews; faster)
        WITH_LIBREDWG: ${WITH_LIBREDWG:-1}
